name: Build Custom GKI NetHunter Kernel

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "lts or exact tag such as android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "Optional SUSFS commit"
        required: false
        default: ""
      device_name:
        description: "Artifact/device name"
        required: true
        default: "gki-custom"
      enable_bbg:
        description: "Enable Baseband Guard"
        required: true
        default: "true"
      enable_hid:
        description: "Enable USB HID gadget and host support"
        required: true
        default: "true"
      enable_can:
        description: "Enable CAN and USB-CAN support"
        required: true
        default: "true"
      enable_nethunter:
        description: "Enable NetHunter WiFi/Bluetooth/USB/SDR support"
        required: true
        default: "true"
      enable_sdr:
        description: "Enable SDR/DVB USB support"
        required: true
        default: "true"

permissions:
  contents: read

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl wget ca-certificates bc bison flex gawk \
            build-essential python3 python3-pip python3-setuptools \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler ccache zip unzip \
            rsync perl pahole lz4 xz-utils

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=8G
          ccache --set-config=cache_dir="$CCACHE_DIR"

      - name: Resolve manifest
        run: |
          set -euo pipefail
          input="${{ github.event.inputs.os_patch_level }}"

          if [ "$input" = "lts" ]; then
            manifest_ref="common-${VERSION}-lts"
            pin_tag=""
          else
            manifest_ref="common-${VERSION}"
            pin_tag="$input"
          fi

          {
            echo "MANIFEST_REF=$manifest_ref"
            echo "PIN_TAG=$pin_tag"
          } >> "$GITHUB_ENV"

      - name: Sync Android GKI source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Checkout requested GKI tag
        if: ${{ env.PIN_TAG != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          remote="$(git remote | head -n1)"
          git fetch --depth=1 "$remote" \
            "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"
          git checkout "refs/tags/${PIN_TAG}"

      - name: Detect kernel version
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sublevel="$(awk '$1 == "SUBLEVEL" {print $3; exit}' Makefile)"
          echo "SUBLEVEL=$sublevel" >> "$GITHUB_ENV"

      - name: Clone SUSFS
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone \
            -b gki-android12-5.10 \
            --depth=1 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cd susfs4ksu

          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git fetch --depth=1 origin \
              "${{ github.event.inputs.susfs_commit }}"
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi

          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply SUSFS files
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .

          patch -p1 --fuzz=3 \
            < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Setup KernelSU Next
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

      - name: Apply KernelSU static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail
          curl -fsSL -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch
          patch -p1 --forward < static.patch || true

      - name: Install Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          wget -qO- \
            https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh \
            | bash

      - name: Configure Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          if grep -q 'config BBG' common/security/Kconfig 2>/dev/null; then
            echo "BBG Kconfig found"
          else
            echo "::warning::BBG Kconfig was not found"
          fi

      - name: Apply BBRv3
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          patch_file="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"

          if [ -f "$patch_file" ]; then
            if patch -p1 < "$patch_file"; then
              echo "BBRV3_PATCH_APPLIED=true" >> "$GITHUB_ENV"
            else
              echo "::warning::BBRv3 patch did not apply"
              echo "BBRV3_PATCH_APPLIED=false" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::BBRv3 patch was not found"
            echo "BBRV3_PATCH_APPLIED=false" >> "$GITHUB_ENV"
          fi

      - name: Apply all configs safely
        working-directory: kernel_workspace/common
        env:
          ENABLE_HID: ${{ github.event.inputs.enable_hid }}
          ENABLE_CAN: ${{ github.event.inputs.enable_can }}
          ENABLE_NETHUNTER: ${{ github.event.inputs.enable_nethunter }}
          ENABLE_SDR: ${{ github.event.inputs.enable_sdr }}
          ENABLE_BBG: ${{ github.event.inputs.enable_bbg }}
          BBRV3_PATCH_APPLIED: ${{ env.BBRV3_PATCH_APPLIED }}
        run: |
          set -euo pipefail

          cfg="arch/arm64/configs/gki_defconfig"
          tmp="$(mktemp)"

          cat > /tmp/required.configs <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_DEVTMPFS=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_INPUT=y
          CONFIG_INPUT_EVDEV=y
          CONFIG_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_USB_SERIAL=y
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_FTDI_SIO=y
          CONFIG_USB_SERIAL_PL2303=y
          CONFIG_USB_SERIAL_CP210X=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_OPTION=y
          CONFIG_USB_SERIAL_QUALCOMM=y
          CONFIG_USB_SERIAL_SIMPLE=y
          CONFIG_USB_ACM=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIBCM203X=y
          CONFIG_BT_HCIBPA10X=y
          CONFIG_BT_HCIBFUSB=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_MESH=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=y
          CONFIG_CARL9170=y
          CONFIG_ATH6KL=y
          CONFIG_ATH6KL_USB=y
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=y
          CONFIG_RT2500USB=y
          CONFIG_RT73USB=y
          CONFIG_RT2800USB=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=y
          CONFIG_RTL_CARDS=y
          CONFIG_RTL8192CU=y
          CONFIG_RTL8XXXU=y
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_WLAN_VENDOR_ZYDAS=y
          CONFIG_USB_ZD1201=y
          CONFIG_ZD1211RW=y
          CONFIG_USB_NET_RNDIS_WLAN=y
          CONFIG_USB_RTL8150=y
          CONFIG_USB_RTL8152=y
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_USB_SUPPORT=y
          CONFIG_MEDIA_SDR_SUPPORT=y
          CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y
          CONFIG_DVB_USB_RTL28XXU=y
          CONFIG_DVB_RTL2830=y
          CONFIG_USB_AIRSPY=y
          CONFIG_USB_HACKRF=y
          CONFIG_USB_MSI2500=y
          CONFIG_CAN=y
          CONFIG_CAN_RAW=y
          CONFIG_CAN_BCM=y
          CONFIG_CAN_GW=y
          CONFIG_CAN_DEV=y
          CONFIG_CAN_VCAN=y
          CONFIG_CAN_VXCAN=y
          CONFIG_CAN_SLCAN=y
          CONFIG_CAN_CALC_BITTIMING=y
          CONFIG_CAN_J1939=y
          CONFIG_CAN_ISOTP=y
          CONFIG_CAN_KVASER_USB=y
          CONFIG_CAN_PEAK_USB=y
          CONFIG_CAN_EMS_USB=y
          CONFIG_CAN_8DEV_USB=y
          CONFIG_CAN_GS_USB=y
          CONFIG_CAN_ESD_USB2=y
          CONFIG_CAN_MCBA_USB=y
          CONFIG_CAN_UCAN=y
          CONFIG_IIO=y
          CONFIG_IIO_CONFIGFS=y
          CONFIG_PCI_ENDPOINT=y
          CONFIG_PCI_ENDPOINT_CONFIGFS=y
          EOF

          if [ "$ENABLE_HID" = "true" ]; then
            cat >> /tmp/required.configs <<'EOF'
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_OBEX=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_F_LB_SS=y
          CONFIG_USB_CONFIGFS_F_PRINTER=y
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_CONFIGFS_F_UAC1_LEGACY=y
          CONFIG_USB_HID=y
          EOF
          fi

          if [ "$BBRV3_PATCH_APPLIED" = "true" ]; then
            echo "CONFIG_TCP_CONG_BBR3=y" >> /tmp/required.configs
          fi

          if [ "$ENABLE_BBG" = "true" ]; then
            echo "CONFIG_BBG=y" >> /tmp/required.configs
          fi

          if [ "$ENABLE_NETHUNTER" != "true" ]; then
            sed -i \
              -e '/^CONFIG_BT_/d' \
              -e '/^CONFIG_CFG80211_WEXT/d' \
              -e '/^CONFIG_MAC80211/d' \
              -e '/^CONFIG_WLAN_/d' \
              -e '/^CONFIG_ATH/d' \
              -e '/^CONFIG_CARL/d' \
              -e '/^CONFIG_RT/d' \
              -e '/^CONFIG_RTL/d' \
              -e '/^CONFIG_ZD/d' \
              /tmp/required.configs
          fi

          if [ "$ENABLE_CAN" != "true" ]; then
            sed -i '/^CONFIG_CAN/d' /tmp/required.configs
          fi

          if [ "$ENABLE_SDR" != "true" ]; then
            sed -i \
              -e '/^CONFIG_MEDIA_/d' \
              -e '/^CONFIG_DVB_/d' \
              -e '/^CONFIG_USB_AIRSPY/d' \
              -e '/^CONFIG_USB_HACKRF/d' \
              -e '/^CONFIG_USB_MSI2500/d' \
              /tmp/required.configs
          fi

          while IFS= read -r line; do
            symbol="${line%%=*}"
            value="${line#*=}"
            name="${symbol#CONFIG_}"

            if grep -RqsE \
              "^[[:space:]]*(config|menuconfig)[[:space:]]+$name([[:space:]]|$)" \
              --include='Kconfig*' .; then
              printf '%s\n' "$line" >> "$tmp"
            else
              echo "::warning::Skipping unavailable symbol: $symbol"
            fi
          done < /tmp/required.configs

          {
            echo
            echo "# Custom NetHunter/KSU configuration"
            cat "$tmp"
          } >> "$cfg"

          rm -f "$tmp"

      - name: Remove invalid duplicate config entries
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          cfg="arch/arm64/configs/gki_defconfig"
          awk '!seen[$0]++' "$cfg" > "$cfg.clean"
          mv "$cfg.clean" "$cfg"

      - name: Fix custom local version
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ -f scripts/setlocalversion ]; then
            mv scripts/setlocalversion scripts/setlocalversion.orig
          fi

          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf '%s' '-BLAZE-NETHUNTER-KSUNv1'
          EOF

          chmod +x scripts/setlocalversion

      - name: Relax module-list bookkeeping
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          find . -maxdepth 1 -type f -name 'build.config*' -print0 |
            xargs -0 -r sed -i \
              -e 's/^MODULES_ORDER=.*/MODULES_ORDER=/' \
              -e 's/^MODULES_LIST=.*/MODULES_LIST=/'

      - name: Build GKI kernel
        working-directory: kernel_workspace
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64
          CCACHE_DIR: /home/runner/.ccache
          USE_CCACHE: "1"
          LTO: thin
          KBUILD_BUILD_USER: builder
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euo pipefail
          build/build.sh -j"$(nproc)"

      - name: Verify final configuration
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          cfg="$(find out -name .config -type f | head -n1)"
          test -n "$cfg"

          required=(
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_NAMESPACES
            CONFIG_NET_NS
            CONFIG_CGROUPS
            CONFIG_USB_GADGET
            CONFIG_USB_CONFIGFS
            CONFIG_HIDRAW
          )

          for symbol in "${required[@]}"; do
            if ! grep -q "^${symbol}=y$" "$cfg"; then
              echo "::warning::${symbol} is not y in final config"
            fi
          done

          if [ "${{ github.event.inputs.enable_hid }}" = "true" ]; then
            grep -q '^CONFIG_USB_CONFIGFS_F_HID=y$' "$cfg" ||
              echo "::warning::USB HID gadget config was dropped"
          fi

          if [ "${{ github.event.inputs.enable_can }}" = "true" ]; then
            grep -q '^CONFIG_CAN=y$' "$cfg" ||
              echo "::warning::CAN config was dropped"
          fi

          if [ "${{ github.event.inputs.enable_nethunter }}" = "true" ]; then
            grep -q '^CONFIG_MAC80211=y$' "$cfg" ||
              echo "::warning::mac80211 config was dropped"
            grep -q '^CONFIG_BT_HCIBTUSB=y$' "$cfg" ||
              echo "::warning::Bluetooth USB config was dropped"
          fi

          cp "$cfg" "$GITHUB_WORKSPACE/final-kernel.config"

      - name: Locate Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          image="$(find out -type f \( \
            -path '*/dist/Image' -o \
            -name Image \
          \) | head -n1)"

          test -n "$image"
          cp "$image" "$GITHUB_WORKSPACE/Image"

      - name: Create artifact
        run: |
          set -euo pipefail

          mkdir -p artifact
          cp Image artifact/Image
          cp final-kernel.config artifact/kernel.config
          printf '%s\n' \
            "Kernel: android12-5.10" \
            "Device: ${{ github.event.inputs.device_name }}" \
            "SUSFS: ${SUSFS_COMMIT:-unknown}" \
            > artifact/build-info.txt

          cd artifact
          zip -9 -r \
            "../${{ github.event.inputs.device_name }}-NetHunter-Kernel.zip" \
            .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-nethunter-kernel
          path: |
            *.zip
            final-kernel.config
          retention-days: 14
