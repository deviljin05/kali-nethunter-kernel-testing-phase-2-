name: Build WildKSU NetHunter GKI

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "lts or exact tag, e.g. android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"

      susfs_commit:
        description: "Optional SUSFS commit"
        required: false
        default: ""

      device_name:
        description: "Artifact label"
        required: true
        default: "gki-custom"

      enable_bbg:
        description: "Enable Baseband Guard"
        required: true
        default: "true"

      enable_hid:
        description: "Enable USB HID gadget/host"
        required: true
        default: "true"

      enable_nethunter:
        description: "Enable Bluetooth, WiFi and USB NetHunter drivers"
        required: true
        default: "true"

      enable_sdr:
        description: "Enable SDR/DVB support"
        required: true
        default: "true"

      enable_can:
        description: "Enable CAN and USB-CAN support"
        required: true
        default: "true"

      include_firmware:
        description: "Package common Linux firmware"
        required: true
        default: "true"

permissions:
  contents: read

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git curl wget ca-certificates \
            bc bison flex gawk perl rsync \
            build-essential \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler pahole \
            python3 python3-pip python3-setuptools \
            ccache zip unzip xz-utils lz4

      - name: Install repo tool
        run: |
          set -eux

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure ccache
        run: |
          set -eux

          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --max-size=8G

      - name: Resolve manifest
        run: |
          set -euo pipefail

          input="${{ github.event.inputs.os_patch_level }}"

          if [ "$input" = "lts" ]; then
            manifest_ref="common-${VERSION}-lts"
            pin_tag=""
          else
            manifest_ref="common-${VERSION}"
            pin_tag="$input"
          fi

          {
            echo "MANIFEST_REF=$manifest_ref"
            echo "PIN_TAG=$pin_tag"
          } >> "$GITHUB_ENV"

      - name: Sync Android GKI source
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Pin requested kernel tag
        if: ${{ env.PIN_TAG != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          remote="$(git remote | head -n1)"
          test -n "$remote"

          git fetch --depth=1 "$remote" \
            "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"

          git checkout "refs/tags/${PIN_TAG}"

      - name: Detect kernel version
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          sublevel="$(awk '$1 == "SUBLEVEL" {print $3; exit}' Makefile)"
          echo "SUBLEVEL=$sublevel" >> "$GITHUB_ENV"

      - name: Clone SUSFS
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cd susfs4ksu

          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git fetch --depth=1 origin \
              "${{ github.event.inputs.susfs_commit }}"
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi

          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy SUSFS files
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch .

      - name: Apply SUSFS compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ "${SUBLEVEL:-999}" -le 43 ]; then
            perl -i -pe \
              's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/' \
              fs/proc/base.c || true
          fi

          if [ "${SUBLEVEL:-999}" -le 117 ]; then
            perl -i -pe \
              's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' \
              fs/notify/fdinfo.c || true

            perl -i -pe \
              's/ignored_mask:%x/ignored_mask:0/g' \
              fs/notify/fdinfo.c || true
          fi

      - name: Apply SUSFS patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 \
            < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS set_nameidata
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          sed -i \
            's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
            fs/namei.c || true

      - name: Apply SUSFS show_pad compatibility fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ "${SUBLEVEL:-999}" -le 209 ]; then
            sed -i \
              's/goto show_pad;/return 0;/' \
              fs/proc/task_mmu.c || true
          fi

      - name: Setup KernelSU Next
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

      - name: Apply KernelSU static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail

          curl -fsSL -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch

          patch -p1 --forward < static.patch || true

      - name: Install Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          wget -qO- \
            https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh \
            | bash

      - name: Configure Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          if grep -RqsE \
            '^[[:space:]]*(config|menuconfig)[[:space:]]+BBG([[:space:]]|$)' \
            common --include='Kconfig*'; then
            echo "CONFIG_BBG=y" >> common/arch/arm64/configs/nethunter.fragment
          else
            echo "::warning::BBG Kconfig symbol was not found"
          fi

      - name: Apply BBRv3
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          patch_file="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"

          if [ -f "$patch_file" ] && patch -p1 < "$patch_file"; then
            echo "BBRV3_PATCH_APPLIED=true" >> "$GITHUB_ENV"
          else
            echo "BBRV3_PATCH_APPLIED=false" >> "$GITHUB_ENV"
            echo "::warning::BBRv3 patch was not applied"
          fi

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ "${SUBLEVEL:-999}" -le 208 ]; then
            curl -fsSL -o /tmp/ntsync-lockdep.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch

            patch -p1 -N < /tmp/ntsync-lockdep.patch || true
          fi

          curl -fsSL -o /tmp/ntsync-compat.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch

          patch -p1 < /tmp/ntsync-compat.patch || true

          curl -fsSL -o /tmp/ntsync-base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch

          patch -p1 < /tmp/ntsync-base.patch || true

      - name: Apply Droidspaces patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/droidspaces-sysvipc.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          patch -p1 < /tmp/droidspaces-sysvipc.patch || true

          curl -fsSL -o /tmp/droidspaces-mqueue.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

          patch -p1 < /tmp/droidspaces-mqueue.patch || true

      - name: Generate safe NetHunter config fragment
        working-directory: kernel_workspace/common
        env:
          HID: ${{ github.event.inputs.enable_hid }}
          NETHUNTER: ${{ github.event.inputs.enable_nethunter }}
          SDR: ${{ github.event.inputs.enable_sdr }}
          CAN: ${{ github.event.inputs.enable_can }}
          BBG: ${{ github.event.inputs.enable_bbg }}
          BBRV3: ${{ env.BBRV3_PATCH_APPLIED }}
        run: |
          set -euo pipefail

          fragment="$PWD/arch/arm64/configs/nethunter.fragment"
          : > "$fragment"

          cat >> "$fragment" <<'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_ANDROID_BINDER_IPC=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_IIO=y
          CONFIG_IIO_CONFIGFS=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_NTSYNC=y
          EOF

          if [ "$HID" = "true" ]; then
            cat >> "$fragment" <<'EOF'
          CONFIG_INPUT_EVDEV=y
          CONFIG_HID=y
          CONFIG_HID_GENERIC=y
          CONFIG_HIDRAW=y
          CONFIG_UHID=y
          CONFIG_USB_HID=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_OBEX=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_EEM=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_UEVENT=y
          CONFIG_USB_CONFIGFS_F_PRINTER=y
          CONFIG_USB_CONFIGFS_F_UAC1=y
          CONFIG_USB_ACM=y
          EOF
          fi

          if [ "$NETHUNTER" = "true" ]; then
            cat >> "$fragment" <<'EOF'
          CONFIG_BT=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=m
          CONFIG_CARL9170=m
          CONFIG_ATH6KL=m
          CONFIG_ATH6KL_USB=m
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2500USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2800USB=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=m
          CONFIG_RTL8192CU=m
          CONFIG_RTL8XXXU=m
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_WLAN_VENDOR_ZYDAS=y
          CONFIG_USB_ZD1201=m
          CONFIG_ZD1211RW=m
          CONFIG_USB_NET_RNDIS_WLAN=m
          CONFIG_USB_RTL8150=m
          CONFIG_USB_RTL8152=m
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_GENERIC=m
          CONFIG_USB_SERIAL_FTDI_SIO=m
          CONFIG_USB_SERIAL_PL2303=m
          CONFIG_USB_SERIAL_CP210X=m
          CONFIG_USB_SERIAL_CH341=m
          CONFIG_USB_SERIAL_OPTION=m
          CONFIG_USB_SERIAL_QUALCOMM=m
          CONFIG_USB_SERIAL_SIMPLE=m
          EOF
          fi

          if [ "$SDR" = "true" ]; then
            cat >> "$fragment" <<'EOF'
          CONFIG_MEDIA_SUPPORT=y
          CONFIG_MEDIA_USB_SUPPORT=y
          CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y
          CONFIG_MEDIA_SDR_SUPPORT=y
          CONFIG_DVB_USB_RTL28XXU=m
          CONFIG_DVB_RTL2830=m
          CONFIG_DVB_RTL2832=m
          CONFIG_USB_AIRSPY=m
          CONFIG_USB_HACKRF=m
          CONFIG_USB_MSI2500=m
          EOF
          fi

          if [ "$CAN" = "true" ]; then
            cat >> "$fragment" <<'EOF'
          CONFIG_CAN=y
          CONFIG_CAN_RAW=y
          CONFIG_CAN_BCM=y
          CONFIG_CAN_GW=y
          CONFIG_CAN_DEV=y
          CONFIG_CAN_CALC_BITTIMING=y
          CONFIG_CAN_VCAN=y
          CONFIG_CAN_VXCAN=y
          CONFIG_CAN_SLCAN=m
          CONFIG_CAN_J1939=y
          CONFIG_CAN_ISOTP=y
          CONFIG_CAN_KVASER_USB=m
          CONFIG_CAN_PEAK_USB=m
          CONFIG_CAN_EMS_USB=m
          CONFIG_CAN_8DEV_USB=m
          CONFIG_CAN_GS_USB=m
          CONFIG_CAN_ESD_USB2=m
          CONFIG_CAN_MCBA_USB=m
          CONFIG_CAN_UCAN=m
          EOF
          fi

          if [ "$BBRV3" = "true" ]; then
            echo "CONFIG_TCP_CONG_BBR3=y" >> "$fragment"
          fi

          awk '!seen[$0]++' "$fragment" > "$fragment.tmp"
          mv "$fragment.tmp" "$fragment"

      - name: Apply available configuration fragment
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          fragment="arch/arm64/configs/nethunter.fragment"

          if [ ! -x scripts/kconfig/merge_config.sh ]; then
            chmod +x scripts/kconfig/merge_config.sh
          fi

          filtered="$(mktemp)"

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            symbol="${line%%=*}"
            name="${symbol#CONFIG_}"

            if grep -RqsE \
              "^[[:space:]]*(config|menuconfig)[[:space:]]+$name([[:space:]]|$)" \
              --include='Kconfig*' .; then
              printf '%s\n' "$line" >> "$filtered"
            else
              echo "::warning::Skipping unavailable symbol: $symbol"
            fi
          done < "$fragment"

          mv "$filtered" "$fragment"

          scripts/kconfig/merge_config.sh \
            -m \
            -r \
            arch/arm64/configs/gki_defconfig \
            "$fragment"

      - name: Generate and normalize final defconfig
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            O="$PWD/out" \
            olddefconfig

          cp out/.config "$GITHUB_WORKSPACE/resolved-kernel.config"

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            O="$PWD/out" \
            savedefconfig

          cp out/defconfig arch/arm64/configs/gki_defconfig

          make \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            O="$PWD/out" \
            olddefconfig

          cp out/.config "$GITHUB_WORKSPACE/final-kernel.config"

      - name: Disable strict defconfig comparison
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          find common -maxdepth 2 \
            -type f \
            -name 'build.config*' \
            -print0 |
            xargs -0 -r sed -i \
              -e 's/^CHECK_DEFCONFIG=.*/CHECK_DEFCONFIG=false/' \
              -e 's/;check_defconfig//g' \
              -e 's/ check_defconfig//g'

      - name: Disable strict modules-list comparison
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          find . -maxdepth 2 \
            -type f \
            -name 'build.config*' \
            -print0 |
            xargs -0 -r sed -i \
              -e 's/^MODULES_ORDER=.*/MODULES_ORDER=/' \
              -e 's/^MODULES_LIST=.*/MODULES_LIST=/'

      - name: Apply kernel branding
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ -f scripts/setlocalversion ]; then
            cp scripts/setlocalversion scripts/setlocalversion.orig
          fi

          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf '%s' '-BLAZE-WILDKSU-NETHUNTER'
          EOF

          chmod +x scripts/setlocalversion

      - name: Build GKI kernel
        working-directory: kernel_workspace
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64
          USE_CCACHE: "1"
          CCACHE_DIR: /home/runner/.ccache
          LTO: thin
          LLVM: "1"
          LLVM_IAS: "1"
          KBUILD_BUILD_USER: builder
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euo pipefail
          build/build.sh -j"$(nproc)"

      - name: Verify final configuration
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          cfg="$(find out -name .config -type f | head -n1)"
          test -n "$cfg"

          for symbol in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_NAMESPACES \
            CONFIG_NET_NS \
            CONFIG_PID_NS \
            CONFIG_CGROUPS \
            CONFIG_USB_GADGET \
            CONFIG_USB_CONFIGFS; do
            grep -q "^${symbol}=y$" "$cfg" ||
              echo "::warning::${symbol} is not enabled in final config"
          done

          if [ "${{ github.event.inputs.enable_hid }}" = "true" ]; then
            grep -q '^CONFIG_USB_CONFIGFS_F_HID=y$' "$cfg" ||
              echo "::warning::HID gadget was dropped by Kconfig"
          fi

          if [ "${{ github.event.inputs.enable_nethunter }}" = "true" ]; then
            grep -q '^CONFIG_MAC80211=y$' "$cfg" ||
              echo "::warning::mac80211 was dropped by Kconfig"

            grep -q '^CONFIG_BT_HCIBTUSB=y$' "$cfg" ||
              echo "::warning::Bluetooth USB support was dropped by Kconfig"
          fi

          if [ "${{ github.event.inputs.enable_sdr }}" = "true" ]; then
            grep -q '^CONFIG_MEDIA_SDR_SUPPORT=y$' "$cfg" ||
              echo "::warning::SDR support was dropped by Kconfig"
          fi

          if [ "${{ github.event.inputs.enable_can }}" = "true" ]; then
            grep -q '^CONFIG_CAN=y$' "$cfg" ||
              echo "::warning::CAN support was dropped by Kconfig"
          fi

      - name: Locate built Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          image="$(find out -type f \( \
            -path '*/dist/Image' -o \
            -path '*/dist/Image.lz4' -o \
            -name Image \
          \) | head -n1)"

          test -n "$image"

          case "$image" in
            *.lz4)
              cp "$image" "$GITHUB_WORKSPACE/Image.lz4"
              ;;
            *)
              cp "$image" "$GITHUB_WORKSPACE/Image"
              ;;
          esac

      - name: Collect kernel modules
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/module-package"

          find out -type f -name '*.ko' \
            -exec cp -v {} "$GITHUB_WORKSPACE/module-package/" \; || true

          find "$GITHUB_WORKSPACE/module-package" \
            -type f -name '*.ko' | sort > \
            "$GITHUB_WORKSPACE/module-package/modules.list"

          if [ ! -s "$GITHUB_WORKSPACE/module-package/modules.list" ]; then
            echo "::warning::No external kernel modules were produced"
          fi

      - name: Download common firmware
        if: ${{ github.event.inputs.include_firmware == 'true' }}
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git \
            linux-firmware

          mkdir -p firmware

          cp -a linux-firmware/ath* firmware/ 2>/dev/null || true
          cp -a linux-firmware/rtlwifi firmware/ 2>/dev/null || true
          cp -a linux-firmware/rtl_bt firmware/ 2>/dev/null || true
          cp -a linux-firmware/mediatek firmware/ 2>/dev/null || true
          cp -a linux-firmware/ralink firmware/ 2>/dev/null || true
          cp -a linux-firmware/brcm firmware/ 2>/dev/null || true

      - name: Clone WildKernels AnyKernel3
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            AnyKernel3

      - name: Prepare WildKernels AnyKernel3
        run: |
          set -euo pipefail

          if [ -f Image.lz4 ]; then
            cp Image.lz4 AnyKernel3/Image.lz4
          elif [ -f Image ]; then
            cp Image AnyKernel3/Image
          else
            echo "::error::Kernel Image was not found"
            exit 1
          fi

          cp final-kernel.config AnyKernel3/kernel.config

          if [ -d module-package ]; then
            mkdir -p AnyKernel3/modules
            cp module-package/*.ko \
              AnyKernel3/modules/ 2>/dev/null || true
          fi

          if [ -d firmware ]; then
            cp -a firmware AnyKernel3/firmware
          fi

          cat > AnyKernel3/build-info.txt <<EOF
          Kernel: Android 12 GKI 5.10
          Build: WildKSU + KernelSU-Next + SUSFS + NetHunter
          Device label: ${{ github.event.inputs.device_name }}
          SUSFS commit: ${SUSFS_COMMIT:-unknown}
          BBRv3 applied: ${BBRV3_PATCH_APPLIED:-false}
          Note: device-specific DTB/DTBO/vendor modules may be required
          EOF

          rm -rf AnyKernel3/.git

      - name: Create WildKernels AnyKernel3 ZIP
        run: |
          set -euo pipefail

          cd AnyKernel3

          zip_name="$GITHUB_WORKSPACE/${{ github.event.inputs.device_name }}-WildKSU-NetHunter-AnyKernel3.zip"

          zip -9 -r "$zip_name" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'README.md' \
            -x '*placeholder*'

          test -s "$zip_name"
          unzip -t "$zip_name"

      - name: Create generic kernel files ZIP
        run: |
          set -euo pipefail

          mkdir -p generic-artifact

          if [ -f Image ]; then
            cp Image generic-artifact/Image
          fi

          if [ -f Image.lz4 ]; then
            cp Image.lz4 generic-artifact/Image.lz4
          fi

          cp final-kernel.config generic-artifact/kernel.config

          if [ -d module-package ]; then
            cp -a module-package generic-artifact/modules
          fi

          if [ -d firmware ]; then
            cp -a firmware generic-artifact/firmware
          fi

          cat > generic-artifact/build-info.txt <<EOF
          Android 12 GKI 5.10
          WildKernels AnyKernel3 gki-2.0
          KernelSU-Next
          SUSFS
          NetHunter feature configuration
          Device-specific boot/DTBO/vendor integration is not included
          EOF

          cd generic-artifact

          zip -9 -r \
            "$GITHUB_WORKSPACE/${{ github.event.inputs.device_name }}-NetHunter-GKI-files.zip" \
            .

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-WildKSU-NetHunter
          path: |
            *-WildKSU-NetHunter-AnyKernel3.zip
            *-NetHunter-GKI-files.zip
            final-kernel.config
            resolved-kernel.config
          retention-days: 14
