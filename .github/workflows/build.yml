name: Build Custom GKI Kernel (ReSuKisu + SUSFS + BBRv3 + CAN)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' = rolling common-android12-5.10 branch (recommended). Or give an exact tag (e.g. android12-5.10.264_r00) or a dated maintenance branch (e.g. android12-5.10-2026-07)."
        required: true
        default: "lts"
      susfs_commit:
        description: "SUSFS commit hash on gki-android12-5.10 branch. Pinned by default to a known-working commit."
        required: false
        default: "ec785f47d49f7b3871ca9356f450411020af7017"
      resukisu_ref:
        description: "ReSukiSU ref (tag/commit/branch) to check out. DO NOT leave as 'main' for a real build — main is a rolling branch and can drift out of sync with the pinned susfs_commit above, which is what caused the last bootloop. Set this to whatever tag/commit you last confirmed booted, or to a specific release tag from https://github.com/ReSukiSU/ReSukiSU/tags."
        required: true
        default: "main"
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"
      enable_bbg:
        description: "Enable Baseband Guard (BBG)"
        required: true
        default: "true"
      kernel_lto:
        description: "LTO mode for the build"
        required: true
        default: "thin"
        type: choice
        options:
          - thin
          - none

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Set up 16GB swap
        run: |
          set -euo pipefail
          echo "Existing swap before:"; swapon --show || true; free -h
          sudo fallocate -l 16G /swapfile_ci
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          echo "Swap after:"; swapon --show; free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip rsync cpio kmod libelf-dev dwarves \
            device-tree-compiler \
            clang llvm lld \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${{ env.CCACHE_DIR }}"

      - name: Sync GKI kernel source
        run: |
          set -euo pipefail
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ env.VERSION }} --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to requested tag or branch (if not lts)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REQUESTED="${{ github.event.inputs.os_patch_level }}"
          if [ "$REQUESTED" != "lts" ] && [ -n "$REQUESTED" ]; then
            echo "Fetching and checking out kernel/common ref: $REQUESTED"
            git fetch --depth=1 origin "$REQUESTED" || {
              echo "::error::Could not find '$REQUESTED' as a tag or branch in kernel/common."
              exit 1
            }
            git checkout FETCH_HEAD
          else
            echo "Using rolling lts branch as synced (no pin requested)."
          fi

      - name: Ensure generic "ld" exists for host tool builds
        run: |
          set -euo pipefail
          LLD_PATH="$(command -v ld.lld)"
          if [ -z "$LLD_PATH" ]; then
            echo "::error::ld.lld not found on PATH after installing llvm/lld"
            exit 1
          fi
          sudo ln -sf "$LLD_PATH" /usr/local/bin/ld
          ld --version

      - name: Detect kernel sublevel
        working-directory: kernel_workspace/common
        run: |
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' Makefile | awk '{print $3}')"
          echo "Detected SUBLEVEL: $SUBLEVEL"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU (simonpunk upstream)
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy SUSFS kernel patches
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          cp -v ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -v ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp -v ../susfs4ksu/kernel_patches/*.patch ./

      - name: Apply android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            if grep -qP '(int|size_t)\s+this_len\s*=\s*min_t\(\s*int\s*,' fs/proc/base.c; then
              perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\(\s*int\s*,/size_t this_len = min_t(size_t,/' fs/proc/base.c
            fi
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            if grep -q 'u32 mask = mark->mask & IN_ALL_EVENTS;' fs/notify/fdinfo.c; then
              perl -0777 -i -pe 's/\/\*.*?u32 mask = mark->mask & IN_ALL_EVENTS;\n//s' fs/notify/fdinfo.c
              perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
            fi
          fi

      - name: Apply SUSFS kernel patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::error::No SUSFS patch files found to apply"
            exit 1
          fi
          IFS=$'\n' sorted=($(sort <<<"${patches[*]}")); unset IFS
          for p in "${sorted[@]}"; do
            echo "Applying $p"
            if ! patch -p1 --fuzz=3 < "$p"; then
              echo "::error::$p failed to apply cleanly"
              find . -name "*.rej"
              exit 1
            fi
          done

      - name: Verify SUSFS patch applied cleanly
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if ! grep -q "susfs" fs/statfs.c; then
            echo "::error::SUSFS hooks missing from fs/statfs.c after patching"
            exit 1
          fi

      - name: Fix SUSFS set_nameidata argument mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Revert android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            if grep -q '^size_t this_len = min_t(size_t, count, PAGE_SIZE);$' fs/proc/base.c; then
              sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
            fi
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            if grep -q 'inotify_mark_user_mask(mark)' fs/notify/fdinfo.c; then
              perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
              perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
              perl -i -pe 's/^(\s+if \(inode\) \{)$/$1\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/' fs/notify/fdinfo.c
            fi
          fi

      - name: Apply SUSFS show_pad fix (older sublevels only)
        working-directory: kernel_workspace/common
        run: |
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      - name: Setup ReSuKisu (pinned ref)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.resukisu_ref }}"
          if [ "$REF" = "main" ]; then
            echo "::warning::resukisu_ref is set to 'main' (rolling branch). This is the exact combination that caused the last bootloop, since it can silently drift out of sync with the pinned susfs_commit. Set resukisu_ref to a fixed tag/commit for reproducible builds."
          fi
          echo "Using ReSukiSU ref: $REF"
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "$REF"

      - name: Neutralize KernelSU pre-config Kbuild hard-check
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          KBUILD="drivers/kernelsu/Kbuild"
          if [ -f "$KBUILD" ] && grep -q '\$(error "KernelSU requires' "$KBUILD"; then
            sed -i '/\$(error "KernelSU requires/d' "$KBUILD"
          fi

      - name: Enable KernelSU + SUSFS config
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "# CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_PROC_CMDLINE=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "# CONFIG_KSU_SUSFS_SUS_SU is not set"
          } >> gki_defconfig

      - name: Install Baseband Guard (BBG)
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

      - name: Configure Baseband Guard LSM
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig

      - name: Apply BBRv3 backport
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          BBRV3_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          if [ -f "$BBRV3_PATCH" ]; then
            patch -p1 < "$BBRV3_PATCH" || echo "::warning::BBRv3 patch had rejects"
          fi

      - name: Set networking / TCP congestion configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_BBR3=y"
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr"'
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
          } >> gki_defconfig

      - name: Apply DroidSpaces kABI-safe patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          curl -fLSs -o /tmp/001-sysvipc-kabi.patch "${BASE}/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          patch -p1 < /tmp/001-sysvipc-kabi.patch
          curl -fLSs -o /tmp/002-posix-mqueue-kabi.patch "${BASE}/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          patch -p1 < /tmp/002-posix-mqueue-kabi.patch

      - name: Set DroidSpaces GKI-exclusive kernel configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_SYSVIPC=y"
            echo "CONFIG_POSIX_MQUEUE=y"
            echo "CONFIG_IPC_NS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_UTS_NS=y"
            echo "CONFIG_NET_NS=y"
            echo "CONFIG_NAMESPACES=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_CGROUPS=y"
            echo "CONFIG_CGROUP_DEVICE=y"
            echo "CONFIG_CGROUP_PIDS=y"
            echo "CONFIG_CGROUP_FREEZER=y"
            echo "CONFIG_MEMCG=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_VETH=y"
            echo "CONFIG_BRIDGE=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TMPFS_XATTR=y"
          } >> gki_defconfig

      - name: Set Clean ConfigFS USB Gadget Stack (Removed Conflicts)
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_USB_GADGET=y"
            echo "CONFIG_USB_CONFIGFS=y"
            echo "CONFIG_USB_CONFIGFS_UEVENT=y"
            echo "CONFIG_USB_CONFIGFS_F_FS=y"
            echo "CONFIG_USB_CONFIGFS_F_MTP=y"
            echo "CONFIG_USB_CONFIGFS_F_PTP=y"
            echo "CONFIG_USB_CONFIGFS_F_ACC=y"
            echo "CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y"
            echo "CONFIG_USB_CONFIGFS_F_MIDI=y"
            echo "CONFIG_USB_CONFIGFS_F_HID=y"
            echo "CONFIG_USB_CONFIGFS_RNDIS=y"
            echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y"
          } >> gki_defconfig

      - name: Set rtl8xxxu Wi-Fi driver as built-in (=y)
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_RFKILL=y"
            echo "CONFIG_CFG80211=y"
            echo "CONFIG_MAC80211=y"
            echo "CONFIG_WLAN=y"
            echo "CONFIG_WLAN_VENDOR_REALTEK=y"
            echo "CONFIG_RTL8XXXU=y"
          } >> gki_defconfig

      - name: Set Full CAN Bus Subsystem Support (built-in)
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_CAN=y"
            echo "CONFIG_CAN_RAW=y"
            echo "CONFIG_CAN_BCM=y"
            echo "CONFIG_CAN_GW=y"
            echo "CONFIG_CAN_DEV=y"
            echo "CONFIG_CAN_CALC_BITTIMING=y"
            echo "CONFIG_CAN_VCAN=y"
            echo "CONFIG_CAN_SLCAN=y"
            echo "CONFIG_CAN_USB=y"
            echo "CONFIG_CAN_GS_USB=y"
            echo "CONFIG_CAN_MCP251X=y"
          } >> gki_defconfig

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "208" ]; then
            curl -LSs -o /tmp/0003-lockdep-assert-none-held.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch
            patch -p1 -N < /tmp/0003-lockdep-assert-none-held.patch || true
          fi
          curl -LSs -o /tmp/ntsync_compat_android12-5.10.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch
          patch -p1 < /tmp/ntsync_compat_android12-5.10.patch || true
          curl -LSs -o /tmp/ntsync_base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch
          patch -p1 < /tmp/ntsync_base.patch || true
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Set LTO mode
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          sed -i '/CONFIG_LTO/d' gki_defconfig
          if [ "${{ github.event.inputs.kernel_lto }}" = "none" ]; then
            echo "CONFIG_LTO_NONE=y" >> gki_defconfig
          else
            echo "CONFIG_LTO_CLANG_THIN=y" >> gki_defconfig
          fi

      - name: Build kernel & modules
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          export LLVM=1
          export LLVM_IAS=1

          make -j"$(nproc)" O="$(pwd)/out" ARCH=arm64 CC="$CC" LLVM=1 LLVM_IAS=1 gki_defconfig
          make -j"$(nproc)" O="$(pwd)/out" ARCH=arm64 CC="$CC" LLVM=1 LLVM_IAS=1

      - name: Verify build output
        working-directory: kernel_workspace/common/out
        run: |
          set -euo pipefail
          IMAGE_PATH=""
          for candidate in arch/arm64/boot/Image arch/arm64/boot/Image.gz; do
            if [ -f "$candidate" ]; then
              IMAGE_PATH="$candidate"
              break
            fi
          done
          if [ -z "$IMAGE_PATH" ]; then
            echo "::error::No kernel Image found!"
            exit 1
          fi
          echo "IMAGE_PATH=${IMAGE_PATH}" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 Flashable Zip (kernel only, no separate modules)
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3.git /tmp/AnyKernel3
          rm -rf /tmp/AnyKernel3/.git
          cp "kernel_workspace/common/out/${IMAGE_PATH}" /tmp/AnyKernel3/Image

          cd /tmp/AnyKernel3
          zip -r9 "${GITHUB_WORKSPACE}/${{ github.event.inputs.device_name }}-kernel.zip" . -x ".git*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-${{ env.VERSION }}
          path: |
            ${{ github.workspace }}/*.zip
            kernel_workspace/common/out/arch/arm64/boot/Image*
          if-no-files-found: error
