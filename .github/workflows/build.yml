name: Build Custom GKI Kernel (SukiSU-Ultra / ReSukiSU + SUSFS + BBRv3 + Full HID Support)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' = rolling LTS branch. Or pin an exact GKI release tag, e.g. android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest on gki-android12-5.10 branch)"
        required: false
        default: ""
      ksu_variant:
        description: "Which KernelSU fork to build with. ReSukiSU is a re-fork of SukiSU-Ultra aimed at being more stable/updated more often — try it if sukisu builds start breaking."
        required: true
        type: choice
        options:
          - sukisu
          - resukisu
        default: "sukisu"
      ksu_ref:
        description: "Ref to check out on the chosen fork (branch/tag/commit). 'builtin' = always-latest dev branch with SUSFS baked in (can break mid-refactor). Pin an exact commit hash here for a reproducible/stable build."
        required: true
        default: "builtin"
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"
      enable_bbg:
        description: "Enable Baseband Guard (BBG)"
        required: true
        default: "true"
      enable_hid:
        description: "Enable full USB HID gadget support"
        required: true
        default: "true"
      enable_can:
        description: "Enable CAN bus support"
        required: true
        default: "true"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${CCACHE_DIR}"

      - name: Resolve manifest branch and optional pinned release tag
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_TAG=""
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_TAG="${INPUT}"
          fi
          echo "MANIFEST_REF=${MANIFEST_REF}" >> "$GITHUB_ENV"
          echo "PIN_TAG=${PIN_TAG}" >> "$GITHUB_ENV"

      - name: Sync GKI kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_REF}" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to exact release tag
        if: ${{ env.PIN_TAG != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REMOTE_NAME="$(git remote | head -n1)"
          [ -n "${REMOTE_NAME}" ]
          git fetch --depth=1 "${REMOTE_NAME}" "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"
          git checkout "refs/tags/${PIN_TAG}"

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # NOTE on SUS_SU: official SUSFS docs state that if your KernelSU
      # source already ships non-kprobe (manual) hooks — which SukiSU-Ultra/
      # ReSukiSU's "builtin" tree does — CONFIG_KSU_SUSFS_SUS_SU must stay
      # DISABLED, since the manual-hook driver doesn't provide the SUS_SU
      # fd-install glue that config expects. It's intentionally left out
      # below. (The "undefined symbol: ksu_install_su_fd" build failure is a
      # separate, unrelated upstream gap — see the auto-heal step further
      # down for that.)
      - name: Set SUSFS kernel configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> gki_defconfig

      - name: Copy SUSFS kernel patches
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Apply android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '\#^[[:space:]]*/\*$#,\#^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$#d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS kernel patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS set_nameidata argument mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Revert android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            perl -i -pe 's#^(\s+if \(inode\) \{)#$1
            \t\t/*
            \t\t * IN_ALL_EVENTS represents all of the mask bits
            \t\t * that we expose to userspace.  There is at
            \t\t * least one bit (FS_EVENT_ON_CHILD) which is
            \t\t * used only internally to the kernel.
            \t\t */
            \t\tu32 mask = mark->mask & IN_ALL_EVENTS;#m' fs/notify/fdinfo.c
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS show_pad fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      # SukiSU-Ultra / ReSukiSU replace KernelSU-Next here (pick with the
      # ksu_variant input). ReSukiSU is a re-fork of SukiSU-Ultra kept in
      # sync more aggressively, so it's a good fallback when SukiSU-Ultra's
      # dev branch has a broken commit. For either fork, "main" is the v4
      # modular tree (module-based, KPM-focused) and does NOT carry SUSFS
      # support on the KSU side, while "builtin" is the source-embedded tree
      # that already bundles the KSU-side SUSFS hooks. Passing a non-existent
      # ref (like the old "susfs-main" convention some outdated guides
      # mention) does NOT fail the build — setup.sh silently falls back to
      # its default branch — so we verify the actual checked-out ref below
      # instead of trusting it blindly.
      - name: Setup KernelSU fork (SukiSU-Ultra / ReSukiSU)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.ksu_variant }}" in
            resukisu)
              REPO_OWNER="ReSukiSU"
              REPO_NAME="ReSukiSU"
              KSU_LABEL="ReSukiSU"
              ;;
            *)
              REPO_OWNER="sukisu-ultra"
              REPO_NAME="sukisu-ultra"
              KSU_LABEL="SukiSU"
              ;;
          esac
          SETUP_URL="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/kernel/setup.sh"
          echo "Fetching ${REPO_OWNER}/${REPO_NAME} @ ref '${{ github.event.inputs.ksu_ref }}'"
          curl -fsSL "${SETUP_URL}" | bash -s "${{ github.event.inputs.ksu_ref }}"

          ACTUAL_REF="$(git -C KernelSU rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
          ACTUAL_COMMIT="$(git -C KernelSU rev-parse --short HEAD 2>/dev/null || echo unknown)"
          echo "Checked out: ${ACTUAL_REF} (${ACTUAL_COMMIT})"
          if [ "${ACTUAL_REF}" != "${{ github.event.inputs.ksu_ref }}" ]; then
            echo "::warning::Requested ref '${{ github.event.inputs.ksu_ref }}' but HEAD landed on '${ACTUAL_REF}' (${ACTUAL_COMMIT}) — setup.sh may have silently fallen back to the default branch. If you expected SUSFS baked in, double check this ref actually exists on ${REPO_OWNER}/${REPO_NAME}."
          fi
          echo "KSU_LABEL=${KSU_LABEL}" >> "$GITHUB_ENV"
          echo "SUKISU_COMMIT=${ACTUAL_COMMIT}" >> "$GITHUB_ENV"

      # Best-effort auto-heal for known SukiSU-Ultra "builtin" churn.
      # The builtin branch is an actively-refactored dev branch (feature/ksud
      # rework in progress), so it occasionally lands commits where a
      # feature struct registers a .set_handler that was never actually
      # written (only the _get counterpart exists) — e.g. kernel_umount.c
      # referencing an undefined kernel_umount_feature_set. When that
      # specific pattern shows up, fall back to a NULL (read-only) setter so
      # the build isn't blocked by upstream's in-progress work. This is a
      # narrow, idempotent check: if upstream later ships the real function,
      # HAS_DEF becomes >0 and this step does nothing.
      - name: Auto-heal known SukiSU-Ultra builtin build breaks
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          FILE="drivers/kernelsu/feature/kernel_umount.c"
          if [ -f "$FILE" ]; then
            HAS_DEF=$(grep -cE 'kernel_umount_feature_set[[:space:]]*\(' "$FILE" || true)
            REGISTERED=$(grep -c '\.set_handler[[:space:]]*=[[:space:]]*kernel_umount_feature_set' "$FILE" || true)
            if [ "${REGISTERED:-0}" -ge 1 ] && [ "${HAS_DEF:-0}" -le "${REGISTERED:-0}" ]; then
              echo "::warning::kernel_umount_feature_set is registered but not defined (known SukiSU-Ultra builtin WIP) — falling back to a read-only handler"
              sed -i 's/\.set_handler[[:space:]]*=[[:space:]]*kernel_umount_feature_set,/.set_handler = NULL,/' "$FILE"
            fi
          fi

      # Auto-heal: "undefined symbol: ksu_install_su_fd" @ fs/exec.c.
      # This is a genuine upstream gap in SukiSU-Ultra/ReSukiSU's "builtin"
      # dev branch: the SUSFS kernel-side patch calls this SUS_SU fd-install
      # hook unconditionally from fs/exec.c, but this dev commit's driver
      # source never shipped a matching definition anywhere in the tree.
      # Rather than guess the function's signature, we look for its
      # prototype/declaration (wherever it's forward-declared so the call
      # even type-checks) and copy its exact return type + parameter list to
      # synthesize a no-op definition, appended directly into fs/exec.c
      # itself (so it always sees whatever types the prototype needs,
      # without header/include guesswork). This only disables SUSFS's
      # SUS_SU fd-hiding for su exec in this build — it does nothing if
      # upstream already ships a real definition (DEF_COUNT check below).
      - name: Auto-heal missing ksu_install_su_fd definition
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if ! grep -q 'ksu_install_su_fd' fs/exec.c 2>/dev/null; then
            echo "fs/exec.c does not reference ksu_install_su_fd — nothing to heal."
            exit 0
          fi
          DEF_COUNT=$(grep -rlE '\bksu_install_su_fd\s*\(' --include='*.c' --include='*.h' . 2>/dev/null | grep -vc '^\./fs/exec\.c$' || true)
          if [ "${DEF_COUNT:-0}" -ge 1 ]; then
            echo "ksu_install_su_fd is resolvable elsewhere in the tree — nothing to heal."
            exit 0
          fi
          echo "::warning::fs/exec.c calls ksu_install_su_fd() with no definition anywhere in the tree (known SukiSU-Ultra/ReSukiSU builtin dev-branch gap). Synthesizing a no-op definition directly in fs/exec.c so the build can complete; SUS_SU fd-hiding will be inert for this build."
          PROTO_LINE=$(grep -rhoE '(extern[[:space:]]+)?[A-Za-z_][A-Za-z0-9_ \*]*\bksu_install_su_fd[[:space:]]*\([^;{]*\)[[:space:]]*;' \
            --include='*.c' --include='*.h' . 2>/dev/null | grep -v '^[[:space:]]*$' | head -n1 || true)
          if [ -z "${PROTO_LINE}" ]; then
            echo "::error::ksu_install_su_fd is called in fs/exec.c but no prototype/declaration exists anywhere in the tree either — cannot safely synthesize a matching definition. Try ksu_variant: resukisu, or pin an older ksu_ref commit instead of 'builtin'."
            exit 1
          fi
          SIG=$(echo "${PROTO_LINE}" | sed -E 's/^[[:space:]]*extern[[:space:]]+//; s/;[[:space:]]*$//')
          if echo "${SIG}" | grep -qE '^[[:space:]]*void\b'; then
            BODY="{ }"
          else
            BODY="{ return 0; }"
          fi
          {
            echo ""
            echo "/* Auto-healed stub (see 'Auto-heal missing ksu_install_su_fd"
            echo " * definition' CI step): this SukiSU-Ultra/ReSukiSU builtin"
            echo " * commit calls this SUSFS SUS_SU hook without shipping a"
            echo " * definition. No-op keeps the build green; SUS_SU fd-hiding"
            echo " * is inactive until upstream ships the real function. */"
            echo "${SIG} ${BODY}"
          } >> fs/exec.c

      # NOTE: the old "Fix KernelSU-Next static patch" step is intentionally
      # removed. That patch (from WildKernels/GKI_KernelSU_SUSFS) targeted a
      # static-assertion bug specific to the pershoot/KernelSU-Next fork and
      # its KernelSU-Next/ directory layout — it doesn't apply to SukiSU-Ultra
      # and there's nothing to replace it with unless a build error surfaces.

      - name: Install Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

      - name: Configure Baseband Guard LSM
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
           set -euo pipefail
           sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      - name: Enable BBG config
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          echo "CONFIG_BBG=y" >> gki_defconfig

      - name: Apply BBRv3 backport
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          BBRV3_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          BBR_CONG_NAME="bbr"
          BBRV3_PATCH_APPLIED="false"
          if [ -f "$BBRV3_PATCH" ] && patch -p1 < "$BBRV3_PATCH"; then
            BBRV3_PATCH_APPLIED="true"
            DETECTED="$(grep -rhoE '\.name\s*=\s*"[a-zA-Z0-9_]+"' net/ipv4/tcp_bbr*.c 2>/dev/null | grep -oE '"[a-zA-Z0-9_]+"' | tr -d '"' | head -n1 || true)"
            [ -n "$DETECTED" ] && BBR_CONG_NAME="$DETECTED"
          fi
          echo "BBR_CONG_NAME=${BBR_CONG_NAME}" >> "$GITHUB_ENV"
          echo "BBRV3_PATCH_APPLIED=${BBRV3_PATCH_APPLIED}" >> "$GITHUB_ENV"

      - name: Set networking / TCP congestion configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BIC=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_TCP_CONG_HTCP=y"
            if [ "${BBRV3_PATCH_APPLIED}" = "true" ]; then
              echo "CONFIG_TCP_CONG_BBR3=y"
            fi
            echo "CONFIG_DEFAULT_TCP_CONG=${BBR_CONG_NAME}"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
          } >> gki_defconfig

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "208" ]; then
            curl -fsSL -o /tmp/0003-lockdep-assert-none-held.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch
            patch -p1 -N < /tmp/0003-lockdep-assert-none-held.patch || true
          fi
          curl -fsSL -o /tmp/ntsync_compat_android12-5.10.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch
          patch -p1 < /tmp/ntsync_compat_android12-5.10.patch || true
          curl -fsSL -o /tmp/ntsync_base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch
          patch -p1 < /tmp/ntsync_base.patch || true
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces kABI-safe patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          DROIDSPACES_KABI_OK="true"
          curl -fsSL -o /tmp/droidspaces_sysvipc_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          if ! patch -p1 < /tmp/droidspaces_sysvipc_kabi.patch; then
            DROIDSPACES_KABI_OK="false"
          fi
          curl -fsSL -o /tmp/droidspaces_posix_mqueue_kabi.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
          if ! patch -p1 < /tmp/droidspaces_posix_mqueue_kabi.patch; then
            DROIDSPACES_KABI_OK="false"
          fi
          echo "DROIDSPACES_KABI_OK=${DROIDSPACES_KABI_OK}" >> "$GITHUB_ENV"

      - name: Set Droidspaces configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          if [ "${DROIDSPACES_KABI_OK}" = "true" ]; then
            {
              echo "CONFIG_SYSVIPC=y"
              echo "CONFIG_POSIX_MQUEUE=y"
              echo "CONFIG_IPC_NS=y"
            } >> gki_defconfig
          fi
          {
            echo "CONFIG_NAMESPACES=y"
            echo "CONFIG_NET_NS=y"
            echo "CONFIG_CGROUPS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TMPFS_XATTR=y"
          } >> gki_defconfig

      - name: Set full USB HID gadget configs
        if: ${{ github.event.inputs.enable_hid == 'true' }}
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          # Note: F_UAC1 and F_UAC1_LEGACY are two separate audio-source
          # function drivers (new vs legacy ALSA path). Some GKI Kconfig
          # versions treat them as a mutually exclusive choice — if the
          # build fails on this pair, drop F_UAC1_LEGACY and keep F_UAC1.
          {
            echo "CONFIG_USB_GADGET=y"
            echo "CONFIG_USB_LIBCOMPOSITE=y"
            echo "CONFIG_USB_CONFIGFS=y"
            echo "CONFIG_USB_CONFIGFS_SERIAL=y"
            echo "CONFIG_USB_CONFIGFS_ACM=y"
            echo "CONFIG_USB_CONFIGFS_OBEX=y"
            echo "CONFIG_USB_CONFIGFS_NCM=y"
            echo "CONFIG_USB_CONFIGFS_ECM=y"
            echo "CONFIG_USB_CONFIGFS_ECM_SUBSET=y"
            echo "CONFIG_USB_CONFIGFS_RNDIS=y"
            echo "CONFIG_USB_CONFIGFS_EEM=y"
            echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y"
            echo "CONFIG_USB_CONFIGFS_F_HID=y"
            echo "CONFIG_USB_CONFIGFS_F_FS=y"
            echo "CONFIG_USB_CONFIGFS_UEVENT=y"
            echo "CONFIG_USB_CONFIGFS_F_LB_SS=y"
            echo "CONFIG_USB_CONFIGFS_F_PRINTER=y"
            echo "CONFIG_USB_CONFIGFS_F_UAC1=y"
            echo "CONFIG_USB_CONFIGFS_F_UAC1_LEGACY=y"
            echo "CONFIG_USB_ACM=y"
            echo "CONFIG_HIDRAW=y"
            echo "CONFIG_UHID=y"
          } >> gki_defconfig

      - name: Set CAN bus configs
        if: ${{ github.event.inputs.enable_can == 'true' }}
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            # Core CAN subsystem + network layer protocols
            echo "CONFIG_CAN=y"
            echo "CONFIG_CAN_RAW=y"
            echo "CONFIG_CAN_BCM=y"
            echo "CONFIG_CAN_GW=y"
            echo "CONFIG_CAN_J1939=y"
            echo "CONFIG_CAN_ISOTP=y"
            # Virtual + serial-line CAN so CARsenal/candump work even without
            # a physical adapter attached (vcan0, slcan)
            echo "CONFIG_CAN_VCAN=y"
            echo "CONFIG_CAN_VXCAN=y"
            echo "CONFIG_CAN_SLCAN=y"
            echo "CONFIG_CAN_DEV=y"
            echo "CONFIG_CAN_CALC_BITTIMING=y"
            # Common USB-CAN adapter drivers (Kvaser Leaf, PEAK PCAN-USB,
            # EMS CPC-USB, 8devices USB2CAN, Geschwister Schneider/candleLight,
            # Microchip usb251xb-style CAN, ESD USB/2)
            echo "CONFIG_CAN_KVASER_USB=y"
            echo "CONFIG_CAN_PEAK_USB=y"
            echo "CONFIG_CAN_EMS_USB=y"
            echo "CONFIG_CAN_8DEV_USB=y"
            echo "CONFIG_CAN_GS_USB=y"
            echo "CONFIG_CAN_ESD_USB2=y"
            echo "CONFIG_CAN_MCBA_USB=y"
            echo "CONFIG_CAN_UCAN=y"
          } >> gki_defconfig

      - name: Set IIO / PCI endpoint configfs configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            # IIO_CONFIGFS needs the IIO core enabled first
            echo "CONFIG_IIO=y"
            echo "CONFIG_IIO_CONFIGFS=y"
            # PCI_ENDPOINT_CONFIGFS needs a PCI endpoint controller framework;
            # most phone SoCs don't expose one, so this may stay "Not set"
            # even after this even if requested — that's a hardware/config
            # dependency limit, not a mistake in this step.
            echo "CONFIG_PCI_ENDPOINT=y"
            echo "CONFIG_PCI_ENDPOINT_CONFIGFS=y"
          } >> gki_defconfig

      - name: Apply custom kernel branding
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          mv scripts/setlocalversion scripts/setlocalversion.orig
          chmod +x scripts/setlocalversion.orig
          cat > scripts/setlocalversion << EOF
          #!/bin/sh
          printf -- '-BLAZE-STABLE'

          EOF
          chmod +x scripts/setlocalversion

      - name: Disable strict defconfig verification
        working-directory: kernel_workspace
        run: sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Disable strict GKI modules list verification
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          # We've added new =m modules that aren't in the upstream
          # android/gki_aarch64_modules allow-list. The GKI build compares the
          # generated modules.order against the file pointed to by MODULES_ORDER
          # (usually android/gki_aarch64_modules) and fails with "modules list
          # out of date" on any mismatch. Blank MODULES_ORDER in every
          # build.config* so build.sh skips that diff check entirely. This only
          # disables the build-time bookkeeping comparison — it does not change
          # which modules get compiled, built into the Image, or loaded at runtime,
          # so it carries no bootloop risk on its own.
          grep -rl '^MODULES_ORDER=' build.config* 2>/dev/null | xargs -r sed -i 's/^MODULES_ORDER=.*/MODULES_ORDER=/' || true
          # Also cover MODULES_LIST in case a downstream config uses that name instead.
          grep -rl '^MODULES_LIST=' build.config* 2>/dev/null | xargs -r sed -i 's/^MODULES_LIST=.*/MODULES_LIST=/' || true

      - name: Build kernel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="ci"
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 USE_CCACHE=1 CCACHE_DIR="${CCACHE_DIR}" build/build.sh -j"$(nproc)"

      - name: Verify final configs
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          CFG=$(find out -name ".config" | head -n1)
          [ -n "$CFG" ]
          for SYM in CONFIG_NAMESPACES CONFIG_NET_NS CONFIG_PID_NS CONFIG_CGROUPS CONFIG_USER_NS CONFIG_USB_CONFIGFS_F_HID CONFIG_USB_CONFIGFS CONFIG_USB_GADGET CONFIG_KSU CONFIG_KSU_SUSFS; do
            grep -q "^${SYM}=y$" "$CFG"
          done
          if [ "${{ github.event.inputs.enable_hid }}" = "true" ]; then
            for SYM in CONFIG_USB_CONFIGFS_F_LB_SS CONFIG_USB_CONFIGFS_F_PRINTER CONFIG_USB_CONFIGFS_F_UAC1; do
              grep -q "^${SYM}=y$" "$CFG" || echo "::warning::${SYM} did not end up enabled in the final .config"
            done
          fi
          if [ "${{ github.event.inputs.enable_can }}" = "true" ]; then
            grep -q "^CONFIG_CAN=y$" "$CFG"
          fi

      - name: Locate built Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG=$(find out -path "*dist/Image" | head -n1)
          if [ -z "$IMG" ]; then
            IMG=$(find out -name "Image" | head -n1)
          fi
          [ -n "$IMG" ]
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          zip -r9 -q "../${{ github.event.inputs.device_name }}-Blaze-android12-5.10-susfs${SUSFS_COMMIT:0:8}.zip" . -x ".git*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: "*.zip"
          retention-days: 14
